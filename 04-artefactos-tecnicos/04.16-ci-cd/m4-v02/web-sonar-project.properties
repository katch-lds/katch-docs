# Análise SonarQube do frontend web (I120; QG-05). Lido pelo SonarScanner na pipeline CI.
sonar.projectKey=katch-frontend-web
sonar.projectName=Katch Frontend Web
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.tsx,src/config/env.ts,src/types/**
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
